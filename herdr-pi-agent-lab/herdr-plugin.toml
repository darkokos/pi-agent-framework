id = "darkokos.pi-agent-lab"
name = "Pi Agent Lab"
version = "0.1.0"
min_herdr_version = "0.8.0"
description = "Create, run, and compare Pi agent versions against standardized tasks"
platforms = ["macos", "linux"]

[[build]]
command = ["./scripts/build.sh"]
platforms = ["macos", "linux"]

[[panes]]
id = "menu"
title = "Pi Agent Lab"
placement = "tab"
command = ["./bin/pi-agent-lab-menu-pane"]

[[panes]]
id = "compare"
title = "Pi Agent Lab — Review Runs"
placement = "tab"
command = ["./bin/pi-agent-lab-pane"]

[[panes]]
id = "run"
title = "Pi Agent Lab — Start a run"
placement = "tab"
command = ["./bin/pi-agent-lab-run-pane"]

[[panes]]
id = "registry"
title = "Pi Agent Lab — Agents & Tasks"
placement = "tab"
command = ["./bin/pi-agent-lab-registry-pane"]

[[panes]]
id = "config"
title = "Pi Agent Lab — Config"
placement = "tab"
command = ["./bin/pi-agent-lab-config-pane"]

[[actions]]
id = "open-menu"
title = "Open Pi Agent Lab"
contexts = ["workspace"]
command = ["herdr", "plugin", "pane", "open", "--plugin", "darkokos.pi-agent-lab", "--entrypoint", "menu"]
